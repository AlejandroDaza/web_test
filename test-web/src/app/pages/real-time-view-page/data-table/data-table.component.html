<section class="example-container mat-elevation-z8" tabindex="0">
    <table mat-table [dataSource]="tableData">
  
      <!-- Position Column -->
      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef> No. </th>
        <td mat-cell *matCellDef="let element"> {{element.id}} </td>
      </ng-container>
  
      <!-- Name Column -->
      <ng-container matColumnDef="hour">
        <th mat-header-cell *matHeaderCellDef> Hour </th>
        <td mat-cell *matCellDef="let element"> {{element.hour}} </td>
      </ng-container>
  
      <!-- Weight Column -->
      <ng-container matColumnDef="temp1">
        <th mat-header-cell *matHeaderCellDef> Temp. Max. </th>
        <td mat-cell *matCellDef="let element"> {{element.temp1}} </td>
      </ng-container>
  
      <!-- Symbol Column -->
      <ng-container matColumnDef="temp2">
        <th mat-header-cell *matHeaderCellDef> Temp. Min. </th>
        <td mat-cell *matCellDef="let element"> {{element.temp2}} </td>
      </ng-container>
  
      <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;" class="fila-hover"></tr>
    </table>
  </section>
